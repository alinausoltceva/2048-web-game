<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2048 — браузерная игра с таблицей рекордов">
    <title>2048</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="game">
        <header class="game-header">
            <h1 class="game-title">2048</h1>

            <div class="game-info">
                <div class="score-container">
                    <span class="score-label">Счёт</span>
                    <span class="score-value" id="score">0</span>
                </div>

                <div class="best-container">
                    <span class="score-label">Рекорд</span>
                    <span class="score-value" id="best-score">0</span>
                </div>
            </div>
        </header>

        <section class="game-controls">
            <button class="control-button" id="new-game-button" type="button">
                Новая игра
            </button>

            <button class="control-button" id="undo-button" type="button">
                Отменить ход
            </button>

            <button class="control-button" id="leaderboard-button" type="button">
                Рекорды
            </button>
        </section>

        <section class="game-board" id="game-board" aria-label="Игровое поле 2048">
            <!-- Игровые плитки будут создаваться динамически -->
        </section>

        <section class="mobile-controls" id="mobile-controls" aria-label="Управление игрой">
            <button class="direction-button" type="button" data-direction="up" aria-label="Вверх">
                ↑
            </button>

            <div class="horizontal-controls">
                <button class="direction-button" type="button" data-direction="left" aria-label="Влево">
                    ←
                </button>

                <button class="direction-button" type="button" data-direction="down" aria-label="Вниз">
                    ↓
                </button>

                <button class="direction-button" type="button" data-direction="right" aria-label="Вправо">
                    →
                </button>
            </div>
        </section>

        <section class="leaderboard" id="leaderboard" hidden>
            <div class="leaderboard-header">
                <h2>Таблица рекордов</h2>

                <button class="close-button" id="close-leaderboard-button" type="button" aria-label="Закрыть">
                    ×
                </button>
            </div>

            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th scope="col">Место</th>
                        <th scope="col">Имя</th>
                        <th scope="col">Очки</th>
                        <th scope="col">Дата</th>
                    </tr>
                </thead>

                <tbody id="leaderboard-body">
                    <!-- Рекорды будут добавляться динамически -->
                </tbody>
            </table>
        </section>

        <section class="game-over" id="game-over" hidden>
            <div class="game-over-content">
                <h2 id="game-over-message">Игра окончена!</h2>

                <p class="final-score">
                    Ваш счёт: <span id="final-score">0</span>
                </p>

                <form class="record-form" id="record-form">
                    <label for="player-name">Введите ваше имя:</label>

                    <input
                        type="text"
                        id="player-name"
                        name="player-name"
                        placeholder="Ваше имя"
                        maxlength="20"
                        required
                    >

                    <button class="control-button" type="submit">
                        Сохранить результат
                    </button>
                </form>

                <button class="control-button" id="restart-button" type="button">
                    Начать заново
                </button>
            </div>
        </section>
    </main>
</body>
</html>
